<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラシード コンボレシピ</title>
<style>
  :root{
    --ink:#13141b;
    --panel:#1b1d26;
    --line:#2e3140;
    --bone:#e9e5d8;
    --mute:#8b8fa3;
    --punish:#f0a93a;
    --impact:#dcd452;
    --setup:#6fc39b; --combo:#8fa6e8;
    --rush:#54c6ea;
    --special:#e2604f;
    --sa:#c9a2ff;
    --warn:#e2604f;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",
                "Noto Sans JP",system-ui,sans-serif;
    font-size:15px;
    line-height:1.7;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 96px; }

  header{ padding:56px 0 24px; display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap; }
  header > div{ flex:1 1 320px; }

  .name{
    margin:0;
    font-size:clamp(40px,9vw,88px);
    line-height:.92;
    font-weight:800;
    letter-spacing:-.02em;
    font-stretch:condensed;
  }

  /* ---------- ボタン共通 ---------- */
  .btn{
    font:inherit; font-size:13px;
    color:var(--bone); background:transparent;
    border:1px solid var(--line); border-radius:2px;
    padding:5px 14px; cursor:pointer;
  }
  .btn:hover{ border-color:var(--mute); }
  .btn:focus-visible{ outline:2px solid var(--rush); outline-offset:2px; }
  .btn.on{ background:var(--bone); color:var(--ink); border-color:var(--bone); }
  .btn.danger:hover{ color:var(--warn); border-color:var(--warn); }
  .btn.small{ font-size:12px; padding:2px 9px; color:var(--mute); }
  .btn.small:hover{ color:var(--bone); }

  /* ---------- フィルタ ---------- */
  .filters{
    position:sticky; top:0; z-index:20;
    background:rgba(19,20,27,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 0 12px;
  }
  .fgroup{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:6px 0; }
  .fgroup > span{ color:var(--mute); font-size:12px; min-width:3.2em; }

  .chip{
    font:inherit; font-size:13px;
    color:var(--bone); background:transparent;
    border:1px solid var(--line); border-radius:2px;
    padding:3px 11px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--mute); }
  .chip[aria-pressed="true"]{ background:var(--bone); color:var(--ink); border-color:var(--bone); }
  .chip:focus-visible{ outline:2px solid var(--rush); outline-offset:2px; }

  .count{ color:var(--mute); font-size:12px; margin:10px 0 0; }

  /* ---------- 編集バー ---------- */
  #editbar{ display:none; margin:16px 0 0; padding:14px 16px; background:var(--panel); border:1px solid var(--line); }
  body.editing #editbar{ display:block; }
  .barrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .namerow{ margin-bottom:10px; }
  .namerow label{ font-size:12px; color:var(--mute); }
  .namerow .hint{ font-size:12px; color:var(--mute); }
  #charName{ width:auto; min-width:12em; }
  .status{ font-size:12px; color:var(--mute); margin:10px 0 0; }
  .status b{ color:var(--bone); font-weight:600; }
  #warn:not(:empty){ color:var(--punish); margin-top:6px; }

  /* ---------- フォーム ---------- */
  #form{ display:none; margin:16px 0 0; padding:20px; background:var(--panel); border:1px solid var(--line); }
  #form.open{ display:block; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px 18px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.wide{ grid-column:1/-1; }
  .field label{ font-size:12px; color:var(--mute); }

  input[type=text], input[type=number], select, textarea{
    font:inherit; font-size:14px;
    color:var(--bone); background:var(--ink);
    border:1px solid var(--line); border-radius:2px;
    padding:6px 9px; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--rush); }
  textarea{ resize:vertical; min-height:60px; }
  #f_recipe{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  .checks{ display:flex; gap:14px; flex-wrap:wrap; padding-top:4px; }
  .checks label{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--bone); cursor:pointer; }
  .checks input{ accent-color:var(--rush); }

  .formfoot{ display:flex; gap:8px; margin-top:18px; align-items:center; flex-wrap:wrap; }
  .formfoot .spacer{ flex:1; }

  .drop{
    border:1px dashed var(--line);
    padding:14px; text-align:center;
    color:var(--mute); font-size:13px; cursor:pointer;
  }
  .drop.hot{ border-color:var(--rush); color:var(--bone); }

  /* ---------- レシピ ---------- */
  .combo{
    display:grid;
    grid-template-columns:minmax(0,420px) minmax(0,1fr);
    gap:28px;
    padding:30px 0;
    border-bottom:1px solid var(--line);
  }
  @media (max-width:820px){ .combo{ grid-template-columns:1fr; gap:16px; } }

  .clip{ position:relative; background:#0a0b0f; border:1px solid var(--line); }
  .clip video{ display:block; width:100%; height:auto; }

  .missing{
    aspect-ratio:16/7;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:6px; padding:16px; text-align:center;
    color:var(--mute); font-size:13px;
  }
  .missing code{ color:var(--bone); font-size:12px; word-break:break-all; }
  .missing.hot{ border:1px dashed var(--rush); color:var(--bone); }

  .controls{ display:flex; gap:6px; align-items:center; padding:7px 8px; border-top:1px solid var(--line); }
  .time{ margin-left:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--mute); }

  .taglist{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:13px; align-items:center; }
  .learn{
    font:inherit; font-size:12px; cursor:pointer;
    background:transparent; border:1px solid var(--line); border-radius:2px;
    padding:1px 9px; color:var(--mute); margin-left:auto;
  }
  .learn:hover{ border-color:var(--mute); color:var(--bone); }
  .learn:focus-visible{ outline:2px solid var(--rush); outline-offset:2px; }
  .learn[aria-pressed="true"]{ color:var(--setup); border-color:var(--setup); }
  .fav{
    font:inherit; font-size:14px; line-height:1; cursor:pointer;
    background:transparent; border:1px solid var(--line); border-radius:2px;
    padding:2px 7px; color:var(--mute); margin-left:auto;
  }
  .fav + .learn{ margin-left:0; }
  .fav:hover{ border-color:var(--mute); color:var(--bone); }
  .fav:focus-visible{ outline:2px solid var(--rush); outline-offset:2px; }
  .fav[aria-pressed="true"]{ color:var(--punish); border-color:var(--punish); }
  .combo.done .recipe, .combo.done .clip{ opacity:.62; }
  .combo.done:hover .recipe, .combo.done:hover .clip{ opacity:1; }
  .prog{ color:var(--setup); }
  .tagchip{ font-size:12px; border:1px solid currentColor; border-radius:2px; padding:1px 8px; line-height:1.5; }

  .recipe{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(16px,2.1vw,21px);
    line-height:1.65; margin:0 0 18px; word-break:break-word;
  }
  .t-normal{ color:var(--bone); }
  .t-special{ color:var(--special); }
  .t-sa{ color:var(--sa); }
  .t-rush{ color:var(--rush); }
  .t-punish{ color:var(--punish); }
  .t-sep{ color:#565b70; padding:0 .15em; }

  .stats{ display:flex; flex-wrap:wrap; gap:26px; align-items:center; padding-top:4px; }
  .stat{ display:flex; align-items:baseline; gap:8px; }
  .stat .k{ color:var(--mute); font-size:12px; }
  .stat .v{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:17px; }

  .gauge{ display:flex; gap:3px; align-items:center; }
  .gauge i{ width:13px; height:16px; border:1px solid var(--line); background:transparent; display:block; }
  .gauge i.on{ background:var(--rush); border-color:var(--rush); }

  .note{ margin:14px 0 0; color:var(--mute); font-size:13.5px; max-width:62ch; }

  .meta{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .meta > span{ font-size:12px; color:var(--mute); }
  .meta > span::before{ content:"/ "; color:#3a3e4f; }

  .rowtools{ display:none; gap:6px; margin-top:14px; flex-wrap:wrap; }
  body.editing .rowtools{ display:flex; }

  .empty{ padding:70px 0; color:var(--mute); }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<div class="filters" id="filters"></div>

<main id="list"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);

const FPS = 20;
/* タグの定義はここが唯一の場所。追加・並び替えはこの2つを編集する */
const TAG_ORDER = ["コンボ", "パニカン", "インパクトパニカン", "壁インパクト", "セットプレイ"];
const TAG_COLOR = {
  "コンボ":             "var(--combo)",
  "パニカン":           "var(--punish)",
  "インパクトパニカン": "var(--impact)",
  "壁インパクト":       "var(--impact)",
  "セットプレイ":       "var(--setup)"
};

let COMBOS = JSON.parse($("#combo-data").textContent);

/* file名 -> 再生用URL（実行時のみ。保存対象ではない） */
const srcMap = new Map();
/* 接続フォルダのハンドルと中身 */
let rootDir = null;
let clipsDir = null;
let dirFiles = new Map();
let dirty = false;

/* combo に対応する実ファイル名 */
function fileNameOf(c){ return c.src || (c.file + ".mp4"); }

/* 接続フォルダを走査 */
async function scanDir(){
  dirFiles.clear();
  if (!clipsDir) return;
  for await (const [name, h] of clipsDir.entries()){
    if (h.kind === "file" && /\.(mp4|webm|mov|m4v)$/i.test(name)) dirFiles.set(name, h);
  }
}

function lookupHandle(name){
  if (dirFiles.has(name)) return dirFiles.get(name);
  const lower = name.toLowerCase();
  for (const [k, v] of dirFiles) if (k.toLowerCase() === lower) return v;
  return null;
}

/* 接続フォルダの動画を実際に読み込んでURL化 */
async function resolveAll(){
  for (const u of srcMap.values()) URL.revokeObjectURL(u);
  srcMap.clear();
  if (!clipsDir) return;
  for (const c of COMBOS){
    if (c.data) continue;
    const h = lookupHandle(fileNameOf(c));
    if (!h) continue;
    try{ srcMap.set(c.file, URL.createObjectURL(await h.getFile())); }catch(e){}
  }
}

function fillPicker(){
  const wrap = $("#pickWrap"), sel = $("#f_pick");
  wrap.hidden = !clipsDir;
  if (!clipsDir) return;
  const names = [...dirFiles.keys()].sort((a,b) => a.localeCompare(b, "ja"));
  sel.innerHTML = '<option value="">選択しない</option>' +
    names.map(n => '<option value="' + esc(n) + '">' + esc(n) + "</option>").join("");
}

const FSA = "showDirectoryPicker" in window;

function say(msg){ $("#status").innerHTML = msg; }

function statusLine(){
  const dir = clipsDir
    ? ("<b>" + esc(rootDir ? rootDir.name + "/" + clipsDir.name : clipsDir.name) +
       "</b>（動画 " + dirFiles.size + " 本）")
    : "未接続";
  const dm  = dirty ? " / <b>未保存の変更があります</b>" : "";
  say("レシピ " + COMBOS.length + " 件 / 動画フォルダ: " + dir + dm);

  const w = $("#warn");
  if (clipsDir && !rootDir && clipsDir.name !== "clips"){
    w.innerHTML = "combo.html の隣の clips ではないフォルダを見ています。編集中は再生できますが、" +
                  "保存したHTMLを別の場所で開くと動画が表示されません。";
  } else { w.textContent = ""; }
}
function touch(){ dirty = true; rebuild(); }

/* ============ 表記の色分け ============ */
const RE_MOTION = /^(?:\[?[1-9](?:\]|\[)?)*(?:236236|214214|632146|2141236|41236236|236|214|623|421|41236|63214|22)/;

function classify(tok){
  const t = tok.toUpperCase();
  if (/^(SA[123]|CA)$/.test(t)) return "t-sa";
  if (/^(PC|CH|DI)$/.test(t)) return "t-punish";
  if (/^(DR|DRC)$/.test(t)) return "t-rush";
  if (RE_MOTION.test(t)) return /236236|214214|632146|2141236|41236236/.test(t) ? "t-sa" : "t-special";
  return "t-normal";
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function renderRecipe(str){
  return String(str).split(/\s+/).map(tok =>
    /^[>,~()\[\]+]+$/.test(tok)
      ? '<span class="t-sep">' + esc(tok) + "</span>"
      : '<span class="' + classify(tok) + '">' + esc(tok) + "</span>"
  ).join(" ");
}
function gauge(n){
  let out = '<span class="gauge" aria-label="ドライブゲージ ' + n + '本">';
  for (let i = 0; i < 6; i++) out += '<i class="' + (i < n ? "on" : "") + '"></i>';
  return out + "</span>";
}

/* ============ カード ============ */
function card(c){
  const i = COMBOS.indexOf(c);
  const el = document.createElement("article");
  el.className = "combo" + (learned.has(c.file) ? " done" : "");

  const tags = (c.tags || []).map(t =>
    '<span class="tagchip" style="color:' + (TAG_COLOR[t] || "var(--mute)") + '">' + esc(t) + "</span>"
  ).join("");

  el.innerHTML =
    '<div><div class="clip">' +
      '<video preload="metadata" loop muted playsinline tabindex="0"></video>' +
      '<div class="controls">' +
        '<button class="btn small" data-act="play">再生</button>' +
        '<button class="btn small" data-act="prev" title="1フレーム戻る">&#9664;</button>' +
        '<button class="btn small" data-act="next" title="1フレーム進む">&#9654;</button>' +
        '<button class="btn small" data-act="reset">頭出し</button>' +
        '<span class="time">0.00s</span>' +
      "</div></div></div>" +
    "<div>" +
      '<div class="taglist">' + tags +
        '<button class="fav" data-row="fav" aria-pressed="' + fav.has(c.file) + '" title="お気に入り">' +
        (fav.has(c.file) ? "★" : "☆") + "</button>" +
        '<button class="learn" data-row="learn" aria-pressed="' + learned.has(c.file) + '">' +
        (learned.has(c.file) ? "\u2713 習得済み" : "未習得") + "</button></div>" +
      '<p class="recipe">' + renderRecipe(c.recipe) + "</p>" +
      '<div class="stats">' +
        '<span class="stat"><span class="k">ダメージ</span><span class="v">' + (c.damage || "\u2014") + "</span></span>" +
        '<span class="stat"><span class="k">Dゲージ</span>' + gauge(c.drive) + "</span>" +
        '<span class="stat"><span class="k">SA</span><span class="v">' + (c.sa ? "SA" + c.sa : "\u2014") + "</span></span>" +
      "</div>" +
      (c.note ? '<p class="note">' + esc(c.note) + "</p>" : "") +
      '<div class="meta"><span>' + esc(c.position) + "</span><span>" + esc(c.file) + "</span></div>" +
      '<div class="rowtools">' +
        '<button class="btn small" data-row="edit">編集</button>' +
        (sortKey === "manual"
          ? '<button class="btn small" data-row="up">↑</button>' +
            '<button class="btn small" data-row="down">↓</button>'
          : '<span class="tagchip" style="color:var(--mute)">並べ替え中は移動できません</span>') +
        '<button class="btn small" data-row="dup">複製</button>' +
      "</div>" +
    "</div>";

  const v = $("video", el);
  const time = $(".time", el);
  v.src = srcMap.get(c.file) || c.data || ("clips/" + fileNameOf(c));
  v.setAttribute("aria-label", c.recipe + " のクリップ");

  v.addEventListener("error", () => {
    const box = document.createElement("div");
    box.className = "missing";
    box.innerHTML = "<span>クリップ未配置</span><code>" +
                    (clipsDir ? esc(clipsDir.name) : "clips") + "/" + esc(fileNameOf(c)) + "</code>" +
                    (document.body.classList.contains("editing")
                      ? '<span style="font-size:12px">ここに動画をドロップ</span>' : "");
    v.replaceWith(box);
    wireDrop(box, c);
  });

  const step = d => { v.pause(); v.currentTime = Math.max(0, v.currentTime + d / FPS); };
  const sync = () => { time.textContent = v.currentTime.toFixed(2) + "s"; };
  const toggle = () => v.paused ? v.play() : v.pause();

  v.addEventListener("timeupdate", sync);
  v.addEventListener("seeked", sync);
  v.addEventListener("click", toggle);
  v.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
    if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  });
  v.addEventListener("play",  () => { $('[data-act="play"]', el).textContent = "停止"; });
  v.addEventListener("pause", () => { $('[data-act="play"]', el).textContent = "再生"; });

  wireDrop($(".clip", el), c);

  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.act){
      const a = b.dataset.act;
      if (a === "play") toggle();
      if (a === "next") step(1);
      if (a === "prev") step(-1);
      if (a === "reset"){ v.pause(); v.currentTime = 0; }
      return;
    }
    const r = b.dataset.row;
    if (!r) return;
    if (r === "learn" || r === "fav"){
      const set = r === "learn" ? learned : fav;
      if (set.has(c.file)) set.delete(c.file); else set.add(c.file);
      saveLearned();
      paint();
      return;
    }
    if (r === "edit") openForm(i);
    if (r === "dup"){ COMBOS.splice(i + 1, 0, JSON.parse(JSON.stringify(c))); touch(); }
    if (r === "up" && i > 0){ COMBOS.splice(i - 1, 0, COMBOS.splice(i, 1)[0]); touch(); }
    if (r === "down" && i < COMBOS.length - 1){ COMBOS.splice(i + 1, 0, COMBOS.splice(i, 1)[0]); touch(); }
  });

  return el;
}

/* ============ 動画の受け取り ============ */
function wireDrop(target, combo){
  target.addEventListener("dragover", e => {
    if (!document.body.classList.contains("editing")) return;
    e.preventDefault(); target.classList.add("hot");
  });
  target.addEventListener("dragleave", () => target.classList.remove("hot"));
  target.addEventListener("drop", async e => {
    if (!document.body.classList.contains("editing")) return;
    e.preventDefault(); e.stopPropagation(); target.classList.remove("hot");
    const f = e.dataTransfer.files[0];
    if (f) await attachVideo(f, combo);
  });
}

async function attachVideo(file, combo){
  const name = combo.file + ".mp4";
  const mb = (file.size / 1048576).toFixed(1);

  if (clipsDir){
    try{
      const exists = lookupHandle(name);
      if (exists && !confirm(clipsDir.name + " に " + name + " が既にあります。\n\n" +
                             "上書きすると元のファイルは復元できません。続けますか？")){
        say("中止しました");
        return;
      }
      const fh = await clipsDir.getFileHandle(name, { create:true });
      const w  = await fh.createWritable();
      await w.write(file);
      await w.close();
      combo.src = name;
      await scanDir();
      await resolveAll();
      fillPicker();
      rebuild();
      say("<b>" + clipsDir.name + "/" + name + "</b> に書き込みました（" + mb + " MB）");
      return;
    }catch(err){
      say("書き込みに失敗しました: " + err.message);
    }
  }

  /* フォルダ未接続 -- その場のプレビューのみ */
  srcMap.set(combo.file, URL.createObjectURL(file));
  rebuild();
  say("プレビュー中です。<b>" + name + "</b> という名前で clips フォルダに置くと次回から読み込まれます");
}

/* ============ 習得状況・お気に入り ============
   どちらも file をキーにした Set。localStorage に即時保存し、
   HTML保存時にレシピの learned / fav フラグとしても書き出す。 */
const charName = () => ($(".name") ? $(".name").textContent.trim() : "") || "default";
const lsKey = k => "combo_" + k + ":" + charName();
let learned = new Set();
let fav = new Set();

function loadFlag(k){
  const seed = COMBOS.filter(c => c[k]).map(c => c.file);
  try{
    const raw = localStorage.getItem(lsKey(k));
    if (raw) return new Set(JSON.parse(raw));
  }catch(e){ /* 使えない環境ではHTML側の値のみ */ }
  return new Set(seed);
}
function saveFlag(k, set){
  COMBOS.forEach(c => { if (set.has(c.file)) c[k] = true; else delete c[k]; });
  try{ localStorage.setItem(lsKey(k), JSON.stringify([...set])); }catch(e){}
}
function loadLearned(){ learned = loadFlag("learned"); fav = loadFlag("fav"); }
function saveLearned(){ saveFlag("learned", learned); saveFlag("fav", fav); }

/* ============ 埋め込み動画の展開 ============ */
let embedded = false;

function b64ToBlob(uri){
  const i = uri.indexOf(",");
  const mime = (uri.slice(5, i).split(";")[0]) || "video/mp4";
  const bin = atob(uri.slice(i + 1));
  const buf = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
  return new Blob([buf], { type: mime });
}

async function hydrate(){
  const targets = COMBOS.filter(c => c.data);
  if (!targets.length) return;
  embedded = true;

  for (let i = 0; i < targets.length; i++){
    const c = targets[i];
    $("#count").textContent = "動画を展開中 " + (i + 1) + " / " + targets.length;
    try{
      let blob;
      try{ blob = await (await fetch(c.data)).blob(); }
      catch(e){ blob = b64ToBlob(c.data); }
      srcMap.set(c.file, URL.createObjectURL(blob));
      delete c.data;            // base64 文字列を解放する
    }catch(e){ /* 変換できなければ data のまま使う */ }
    await new Promise(r => setTimeout(r, 0));
  }
  rebuild();
}

/* ============ フィルタ ============ */
const AXES = [
  { key:"position", label:"位置", values:["中央","端"] },
  { key:"tags",     label:"タグ", values:TAG_ORDER, multi:true },
  { key:"sa",       label:"SA",   values:[0,1,2,3], fmt:v => v ? "SA" + v : "なし" },
  { key:"learned",  label:"習得", values:[false, true],
    fmt:v => v ? "習得済み" : "未習得", get:c => learned.has(c.file) },
  { key:"fav",      label:"お気に入り", values:[true],
    fmt:() => "★ お気に入りのみ", get:c => fav.has(c.file) }
];

const SORTS = [
  { key:"manual", label:"記述順" },
  { key:"damage", label:"ダメージ", dir:-1, val:c => c.damage || 0 },
  { key:"drive",  label:"Dゲージ",  dir:1,  val:c => c.drive  || 0 },
  { key:"eff",    label:"効率",     dir:-1, val:c => (c.damage || 0) / (c.drive || 0.5) }
];

let sortKey = "manual";
let sortDir = 0;
let sortGroup = null;

const state = {};
let groups = [];

function buildFilters(){
  const box = $("#filters");
  box.innerHTML = "";
  groups = [];

  AXES.forEach(ax => {
    const g = document.createElement("div");
    g.className = "fgroup";
    g.innerHTML = "<span>" + ax.label + "</span>";

    const all = document.createElement("button");
    all.className = "chip";
    all.textContent = "すべて";
    all.onclick = () => { state[ax.key] = undefined; paint(); };
    g.appendChild(all);

    const btns = ax.values.map(v => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = ax.fmt ? ax.fmt(v) : v;
      b.onclick = () => { state[ax.key] = state[ax.key] === v ? undefined : v; paint(); };
      g.appendChild(b);
      return { btn:b, value:v };
    });

    box.appendChild(g);
    groups.push({ ax, all, btns });
  });

  const g = document.createElement("div");
  g.className = "fgroup";
  g.innerHTML = "<span>並び順</span>";
  const btns = SORTS.map(so => {
    const b = document.createElement("button");
    b.className = "chip";
    b.onclick = () => {
      if (so.key === "manual"){ sortKey = "manual"; sortDir = 0; }
      else if (sortKey === so.key) sortDir = -sortDir;
      else { sortKey = so.key; sortDir = so.dir; }
      paint();
    };
    g.appendChild(b);
    return { btn:b, so };
  });
  box.appendChild(g);
  sortGroup = btns;
}

function sortRows(rows){
  if (sortKey === "manual") return rows;
  const so = SORTS.find(x => x.key === sortKey);
  return rows
    .map((c, i) => ({ c, i }))
    .sort((a, b) => {
      const d = (so.val(a.c) - so.val(b.c)) * sortDir;
      return d || a.i - b.i;
    })
    .map(x => x.c);
}

function paintSort(){
  sortGroup.forEach(({ btn, so }) => {
    const on = sortKey === so.key;
    btn.setAttribute("aria-pressed", String(on));
    btn.textContent = so.label +
      (on && so.key !== "manual" ? (sortDir < 0 ? " ↓" : " ↑") : "");
  });
}

function matches(c){
  return AXES.every(ax => {
    const sel = state[ax.key];
    if (sel === undefined) return true;
    const val = ax.get ? ax.get(c) : c[ax.key];
    return Array.isArray(val) ? val.includes(sel) : val === sel;
  });
}

function paint(){
  const rows = sortRows(COMBOS.filter(matches));
  const list = $("#list");
  list.innerHTML = "";

  if (!rows.length){
    list.innerHTML = '<p class="empty">条件に合うコンボがありません。フィルタを外してください。</p>';
  } else {
    rows.forEach(c => list.appendChild(card(c)));
  }

  const done = COMBOS.filter(c => learned.has(c.file)).length;
  $("#count").innerHTML = rows.length + " / " + COMBOS.length + " 件" +
    (COMBOS.length ? '\u3000<span class="prog">習得 ' + done + " / " + COMBOS.length + "</span>" : "");

  paintSort();

  groups.forEach(({ ax, all, btns }) => {
    const sel = state[ax.key];
    all.setAttribute("aria-pressed", String(sel === undefined));
    btns.forEach(({ btn, value }) => btn.setAttribute("aria-pressed", String(sel === value)));
  });
}

function rebuild(){ paint(); statusLine(); }

/* ============ フォーム ============ */
let editing = -1;

$("#f_tags").innerHTML = TAG_ORDER.map(t =>
  '<label><input type="checkbox" value="' + t + '">' + t + "</label>"
).join("");

function openForm(idx){
  editing = idx;
  const c = idx < 0
    ? { file:"", recipe:"", damage:0, drive:0, sa:0, tags:[], position:"中央", note:"" }
    : COMBOS[idx];

  $("#f_file").value   = c.file;
  $("#f_recipe").value = c.recipe;
  $("#f_dmg").value    = c.damage || "";
  $("#f_drive").value  = c.drive || 0;
  $("#f_sa").value     = String(c.sa || 0);
  $("#f_pos").value    = c.position || "中央";
  $("#f_note").value   = c.note || "";
  document.querySelectorAll("#f_tags input").forEach(cb => {
    cb.checked = (c.tags || []).includes(cb.value);
  });
  fillPicker();
  $("#f_pick").value = (clipsDir && c.src && lookupHandle(c.src)) ? c.src : "";
  $("#delBtn").style.display = idx < 0 ? "none" : "";
  $("#f_drop").textContent = "動画をここにドロップ、またはクリックして選択";

  $("#form").classList.add("open");
  $("#form").scrollIntoView({ block:"nearest" });
  $("#f_file").focus();
}

function closeForm(){ editing = -1; $("#form").classList.remove("open"); }

function readForm(){
  const file = $("#f_file").value.trim().replace(/\.(mp4|webm|mov)$/i, "");
  if (!file){ say("クリップ名を入力してください"); return null; }
  const picked = $("#f_pick").value;
  /* 接続フォルダに大文字小文字だけ違うファイルがあれば実ファイル名を src に記録する */
  let src = picked || undefined;
  if (!src && clipsDir){
    const h = lookupHandle(file + ".mp4");
    if (h && h.name !== file + ".mp4") src = h.name;
  }
  return {
    file,
    src,
    recipe: $("#f_recipe").value.trim(),
    damage: Number($("#f_dmg").value) || 0,
    drive:  Math.max(0, Math.min(6, Number($("#f_drive").value) || 0)),
    sa:     Number($("#f_sa").value) || 0,
    tags:   [...document.querySelectorAll("#f_tags input:checked")].map(cb => cb.value),
    position: $("#f_pos").value,
    note:   $("#f_note").value.trim()
  };
}

$("#cancelBtn").onclick = closeForm;
$("#delBtn").onclick = () => {
  if (editing < 0) return;
  if (!confirm("このレシピを削除しますか？")) return;
  COMBOS.splice(editing, 1);
  closeForm(); touch();
};
$("#addBtn").onclick = () => openForm(-1);

/* フォーム内のドロップ / 選択 */
const drop = $("#f_drop");
const picker = document.createElement("input");
picker.type = "file";
picker.accept = "video/mp4,video/webm,video/*";

async function formVideo(f){
  if (!f) return;
  if (!$("#f_file").value.trim()){
    $("#f_file").value = f.name.replace(/\.[^.]+$/, "");
  }
  drop.textContent = f.name + "（保存時に書き込みます）";
  drop.dataset.ready = "1";
  drop._file = f;
}
picker.onchange = () => formVideo(picker.files[0]);
drop.onclick = () => picker.click();
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("hot"); });
drop.addEventListener("dragleave", () => drop.classList.remove("hot"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("hot");
  formVideo(e.dataTransfer.files[0]);
});

/* 保存（動画があれば同時に書き込む） */
$("#okBtn").onclick = async () => {
  const c = readForm();
  if (!c) return;
  if (editing < 0) COMBOS.push(c); else COMBOS[editing] = c;
  if (drop._file){ await attachVideo(drop._file, c); drop._file = null; }
  else { await resolveAll(); }
  closeForm(); touch();
};

/* ============ フォルダ接続 ============ */
$("#linkBtn").onclick = async () => {
  if (!FSA){
    say("このブラウザはフォルダ接続に対応していません。Chrome / Edge で開くか、動画を手動で clips に置いてください");
    return;
  }
  try{
    const picked = await window.showDirectoryPicker({
      mode: "readwrite",
      id: "comboRoot",
      startIn: rootDir || clipsDir || "desktop"
    });

    let isRoot = false;

    }

      clipsDir = await picked.getDirectoryHandle("clips", { create:true });

      rootDir = null;
      clipsDir = picked;
    }

    await scanDir();
    await resolveAll();
    fillPicker();
    $("#linkBtn").classList.add("on");
    $("#linkBtn").textContent = "接続: " + picked.name;

/* ============ 保存 ============ */
function buildHtml(list){
  const doc = document.documentElement.cloneNode(true);
  doc.querySelector("#combo-data").textContent = "\n" + JSON.stringify(list || COMBOS, null, 2) + "\n";
  doc.querySelector("#list").innerHTML = "";
  doc.querySelector("#filters").innerHTML = "";
  doc.querySelector("#count").textContent = "";
  doc.querySelector("#status").textContent = "";
  doc.querySelector("#form").classList.remove("open");
  doc.querySelector("#linkBtn").className = "btn";
  doc.querySelector("#linkBtn").textContent = "作業フォルダを接続";
  doc.querySelector("#warn").textContent = "";
  const et = doc.querySelector("#editToggle");
  et.className = "btn";
  et.textContent = "編集";
  doc.querySelector("#charName").setAttribute("value", charName());
  doc.querySelector("title").textContent = charName() + " コンボレシピ";
  const pw = doc.querySelector("#pickWrap");
  pw.setAttribute("hidden", "");
  pw.querySelector("select").innerHTML = '<option value="">選択しない</option>';
  doc.querySelector("body").className = "";
  return "<!DOCTYPE html>\n" + doc.outerHTML;
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$("#saveBtn").onclick = async () => {
  if (embedded && !clipsDir &&
      !confirm("このファイルは配布用（動画を埋め込んだもの）です。\n\n" +
               "このまま保存すると動画が外れ、レシピだけのHTMLになります。\n" +
               "続けますか？")) return;
  saveLearned();
  const html = buildHtml(COMBOS.map(c => { const d = Object.assign({}, c); delete d.data; return d; }));
  if ("showSaveFilePicker" in window){
    try{
      const fh = await window.showSaveFilePicker({
        suggestedName: "combo.html",
        id: "comboRoot",
        startIn: rootDir || clipsDir || undefined,
        types: [{ description:"HTML", accept:{ "text/html":[".html"] } }]
      });
      const w = await fh.createWritable();
      await w.write(html);
      await w.close();
      dirty = false; statusLine();
      say("保存しました");
      return;
    }catch(e){
      if (e.name === "AbortError") return;
    }
  }
  download("combo.html", html, "text/html");
  dirty = false; statusLine();
  say("ダウンロードした combo.html で元のファイルを差し替えてください");
};

$("#shareBtn").onclick = async () => {
  if (!clipsDir){
    say("先に「動画フォルダを接続」を押してください。動画を読み込めないと埋め込めません");
    return;
  }

  const list = JSON.parse(JSON.stringify(COMBOS));
  list.forEach(c => { delete c.learned; delete c.fav; });
  const missing = [];
  let total = 0;

  for (let i = 0; i < list.length; i++){
    const c = list[i];
    const h = lookupHandle(c.src || (c.file + ".mp4"));
    if (!h){ missing.push(c.file); continue; }
    say("埋め込み中 " + (i + 1) + " / " + list.length + " ... " + esc(c.file));
    const f = await h.getFile();
    total += f.size;
    c.data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error("読み込み失敗"));
      r.readAsDataURL(f);
    });
  }

  const mb = (total * 1.34 / 1048576).toFixed(1);
  if (total * 1.34 > 200 * 1048576 &&
      !confirm("書き出しサイズが約 " + mb + " MB になります。続けますか？")) {
    say("中止しました");
    return;
  }

  const shareHtml = buildHtml(list);
  let saved = false;
  if ("showSaveFilePicker" in window){
    try{
      const fh = await window.showSaveFilePicker({
        suggestedName: "combo_share.html",
        id: "comboRoot",
        startIn: rootDir || clipsDir || undefined,
        types: [{ description:"HTML", accept:{ "text/html":[".html"] } }]
      });
      const w = await fh.createWritable();
      await w.write(shareHtml); await w.close();
      saved = true;
    }catch(e){ if (e.name === "AbortError"){ say("中止しました"); return; } }
  }
  if (!saved) download("combo_share.html", shareHtml, "text/html");

  let msg = "配布用HTMLを書き出しました（約 " + mb + " MB）。このファイル1つで再生できます";
  if (missing.length) msg += " / 動画が見つからなかったレシピ: <b>" + missing.map(esc).join(", ") + "</b>";
  say(msg);
};

$("#exportBtn").onclick = () =>
  download("combos.json", JSON.stringify(COMBOS, null, 2), "application/json");

$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error("配列ではありません");
    COMBOS = data;
    loadLearned();
    await resolveAll();
    closeForm(); touch();
    say("読み込みました");
  }catch(err){ say("読み込めませんでした: " + err.message); }
  e.target.value = "";
};

/* ============ キャラ名 ============ */
$("#charName").value = charName();
$("#charName").oninput = () => {
  const n = $("#charName").value.trim() || "キャラ名";
  $(".name").textContent = n;
  document.title = n + " コンボレシピ";
  dirty = true; statusLine();
};

/* ============ 編集モード ============ */
$("#editToggle").onclick = () => {
  const on = document.body.classList.toggle("editing");
  $("#editToggle").classList.toggle("on", on);
  $("#editToggle").textContent = on ? "編集を終える" : "編集";
  if (!on) closeForm();
  rebuild();
};

window.addEventListener("beforeunload", e => {
  if (dirty){ e.preventDefault(); e.returnValue = ""; }
});

loadLearned();
buildFilters();
rebuild();
hydrate();
</script>
